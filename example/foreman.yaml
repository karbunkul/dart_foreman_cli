blueprints:
  feature:
    bricks:
      feature_package:
        path: "packages/features"
        vars:
          feature:
            description: "Feature name (underscore case)"
            pattern: ^[a-z]*$
            prompt: "Feature name:"

  exception:
    vars:
      feature:
        behavior: select_directory
        path: "packages/features"
        description: "Feature location"
        prompt: "Select feature:"

      author:
        behavior: shell
        exec: "git config --get user.email"
        description: "The developer's email"

    bricks:
      feature_exception:
        path: "packages/features/{{feature}}/lib/src/exceptions"
        hooks:
          after:
            - inlay build --file="example/packages/features/{{feature}}/lib/src/exceptions/exceptions.dart"
        vars:
          class_name:
            pattern: ^[a-z]*$
            description: "Exception class name for {{feature}}"
            prompt: "Input class name (snake case):"
          platform:
            behavior: select
            options:
              - web
              - desktop
              - mobile
          with_tests:
            behavior: confirm
            default: true
            prompt: "Генерировать тесты?"
          file:
            behavior: select_file
            path: packages/features
            filter: "**/*.dart"
          feature_path:
            behavior: combine
            template: "lib/src/{{feature.pascalCase()}}"